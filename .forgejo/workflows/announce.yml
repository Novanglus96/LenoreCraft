name: Announce
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (e.g. v0.1.0)"
        required: true
jobs:
  reddit:
    uses: lenore/lenore-ci/.forgejo/workflows/announce.yml@v1
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      target: reddit
      dry_run: false
    secrets: inherit
